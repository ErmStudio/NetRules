server.document-root = "/opt/etc/mihomo/www"
server.port = 8090
server.bind = "0.0.0.0"
server.modules = ( "mod_cgi", "mod_alias" )
server.errorlog = "/opt/var/log/mihomo-ui.log"
accesslog.filename = "/dev/null"
cgi.assign = ( ".cgi" => "" )
index-file.names = ( "index.html" )
mimetype.assign = ( ".html" => "text/html; charset=utf-8", ".css" => "text/css" )